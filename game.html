<!DOCTYPE html><html lang=ru><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Мотогонка</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;background:#08140e;color:#e8ffe8;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:100%}#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;padding:calc(8px + env(safe-area-inset-top)) 12px 0;display:flex;justify-content:space-between;text-shadow:0 1px 4px #000}.stat b{display:block;font-size:22px;color:#d4ff3a}.stat{font-size:12px}#biome{background:#0006;border-radius:999px;padding:6px 12px;font-weight:800}#overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#040c08b8}#overlay.hide{display:none}.card{width:min(92vw,420px);background:#0a160ee8;border:1px solid #d4ff3a4d;border-radius:20px;padding:22px 18px;text-align:center}h1{margin:0 0 6px}#btnStart{margin-top:14px;width:100%;border:0;border-radius:14px;padding:16px;font-size:20px;font-weight:800;background:#d4ff3a;color:#10200a}#pads{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;gap:10px;padding:10px 10px calc(12px + env(safe-area-inset-bottom))}.pad{flex:1;height:72px;border:0;border-radius:16px;font-weight:800;font-size:16px;background:#08140cb2;color:#fff}.pad.on{background:#d4ff3a;color:#10200a}.gas{flex:1.4}.hint{text-align:left;background:#0003;padding:10px;border-radius:12px;font-size:14px}</style></head><body><canvas id=c></canvas><div id=hud><div class=stat>ДИСТАНЦИЯ<b id=dist>0 м</b></div><div id=biome>ПОЛЯ</div><div class=stat style=text-align:right>РЕКОРД<b id=best>0 м</b></div></div><div id=pads><button class=pad id=left>◀</button><button class=pad id=brake>ТОРМОЗ</button><button class="pad gas" id=gas>ДЕРЖИ ГАЗ</button><button class=pad id=right>▶</button></div><div id=overlay><div class=card><h1>МОТОГОНКА</h1><p>Поля · Лес · Пустоши</p><div class=hint id=msg>Нажми <b>ПОЕХАЛИ</b>, потом зажми <b>ГАЗ</b>.<br>Стрелки — наклон на трамплине.</div><button id=btnStart>ПОЕХАЛИ</button></div></div><script>(function(){const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),msg=document.getElementById('msg'),distEl=document.getElementById('dist'),bestEl=document.getElementById('best'),biomeEl=document.getElementById('biome');const hold={gas:0,brake:0,left:0,right:0};const BIOMES=[{name:'ПОЛЯ',sky0:'#7ec8ff',sky1:'#e8f6ff',g0:'#6bb03a',g1:'#3d7a1f',dirt:'#5a3a18'},{name:'ЛЕС',sky0:'#5a86aa',sky1:'#d5e8d0',g0:'#2f6b2a',g1:'#163816',dirt:'#3a2612'},{name:'ПУСТОШИ',sky0:'#f0c27a',sky1:'#f7e3b0',g0:'#c4a05a',g1:'#8a6a32',dirt:'#6b4a22'},{name:'СУМЕРКИ',sky0:'#2a1d4a',sky1:'#e07a3d',g0:'#35522a',g1:'#1c2e16',dirt:'#2a1a10'}];let W=800,H=450,dpr=1,perm=[],t=0,speed=0,playing=false,distance=0,best=+localStorage.getItem('moto2_best')||0,particles=[],decor=[];bestEl.textContent=Math.floor(best)+' м';const bike={x:140,y:200,vy:0,rot:0,vr:0};function seed(){perm=[];while(perm.length<512)perm.push(Math.random()*255)}function lerp(a,b,p){return a+(b-a)*p}function noise(x){x=((x*0.008)%255+255)%255;const i=x|0,f=(1-Math.cos((x-i)*Math.PI))/2;return lerp(perm[i],perm[i+1],f)}function ground(wx){const amp=Math.max(36,H*0.09);return H*0.62+(noise(wx)/255)*amp+(noise(wx*0.33+90)/255)*amp*0.4}function biome(d){const span=1600,i=Math.floor(d/span)%BIOMES.length,n=(i+1)%BIOMES.length,fade=(d%span)/span,m=fade>0.8?(fade-0.8)/0.2:0;return{a:BIOMES[i],b:BIOMES[n],m}}function hexMix(a,b,m){const p=s=>[parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)];const A=p(a),B=p(b);return'rgb('+ [0,1,2].map(i=>Math.round(lerp(A[i],B[i],m))).join(',')+')'}function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.max(320,innerWidth);H=Math.max(280,innerHeight);canvas.width=(W*dpr)|0;canvas.height=(H*dpr)|0;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);bike.x=Math.min(180,W*0.28);if(!playing){bike.y=ground(t+bike.x)-26;bike.vy=0}}addEventListener('resize',resize);function bind(id,key){const el=document.getElementById(id);const on=ev=>{ev.preventDefault();hold[key]=1;el.classList.add('on')};const off=ev=>{ev.preventDefault();hold[key]=0;el.classList.remove('on')};['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend'].forEach(n=>el.addEventListener(n,off,{passive:false}))}bind('gas','gas');bind('brake','brake');bind('left','left');bind('right','right');addEventListener('keydown',e=>{if(/ArrowUp|Space|KeyW/.test(e.code))hold.gas=1;if(/ArrowDown|KeyS/.test(e.code))hold.brake=1;if(/ArrowLeft|KeyA/.test(e.code))hold.left=1;if(/ArrowRight|KeyD/.test(e.code))hold.right=1;if((e.code==='Space'||e.code==='Enter')&&!playing)start()});addEventListener('keyup',e=>{if(/ArrowUp|Space|KeyW/.test(e.code))hold.gas=0;if(/ArrowDown|KeyS/.test(e.code))hold.brake=0;if(/ArrowLeft|KeyA/.test(e.code))hold.left=0;if(/ArrowRight|KeyD/.test(e.code))hold.right=0});function start(){seed();t=0;speed=0.35;distance=0;playing=true;particles=[];decor=[];bike.vy=0;bike.rot=0;bike.vr=0;bike.y=ground(bike.x)-26;overlay.classList.add('hide');spawn(true)}document.getElementById('btnStart').onclick=start;function crash(){if(!playing)return;playing=false;if(distance>best){best=distance;localStorage.setItem('moto2_best',String(best));bestEl.textContent=Math.floor(best)+' м'}msg.innerHTML='АВАРИЯ<br>Дистанция: <b>'+Math.floor(distance)+' м</b><br>Рекорд: <b>'+Math.floor(best)+' м</b>';document.getElementById('btnStart').textContent='ЕЩЁ РАЗ';overlay.classList.remove('hide')}function pickKind(name){if(name==='ЛЕС')return Math.random()>0.2?'pine':'stump';if(name==='ПОЛЯ')return['grass','grass','flower','hay'][Math.random()*4|0];if(name==='ПУСТОШИ')return Math.random()>0.45?'rock':'bush';return Math.random()>0.5?'pine':'rock'}function spawn(first){const name=biome(distance).a.name,n=name==='ЛЕС'?8:5;for(let i=0;i<n;i++)decor.push({wx:t+W+(first?Math.random()*W:80+Math.random()*360),kind:pickKind(name),s:0.8+Math.random()*0.7,flip:Math.random()>0.5?1:-1})}let spawnT=0;function update(){const want=playing?((hold.gas?1.05:0.42)-(hold.brake?0.55:0)):0;speed+=(want-speed)*0.04;if(speed<0)speed=0;if(speed>1.2)speed=1.2;const scroll=playing?7.2*Math.max(speed,0.22):0;t+=scroll;if(playing)distance+=scroll*0.22;const g1=ground(t+bike.x),g2=ground(t+bike.x+18),ang=Math.atan2(g2-g1,18),foot=26;if(bike.y+foot<g1-2)bike.vy+=0.7;else{bike.y=g1-foot;bike.vy=bike.vy>10?bike.vy*0.15:0;bike.rot+=(ang-bike.rot)*0.55;bike.vr*=0.6}bike.y+=bike.vy;if(bike.vy>15)bike.vy=15;bike.vr+=(hold.left-hold.right)*0.05;bike.vr*=0.92;bike.rot+=bike.vr*0.1;if(bike.rot>Math.PI)bike.rot-=Math.PI*2;if(bike.rot<-Math.PI)bike.rot+=Math.PI*2;if(playing&&Math.abs(bike.rot)>1.9&&bike.y+foot>=g1-6)crash();if(playing&&bike.y>H+60)crash();spawnT+=scroll;if(spawnT>160){spawnT=0;spawn(false)}decor=decor.filter(d=>d.wx>t-80);if(playing&&hold.gas&&bike.y+foot>=g1-4)particles.push({x:bike.x-18,y:bike.y+16,vx:-2-Math.random(),vy:-Math.random(),life:14,c:biome(distance).a.dirt});particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--});particles=particles.filter(p=>p.life>0);distEl.textContent=Math.floor(distance)+' м';biomeEl.textContent=biome(distance).a.name}function draw(){const B=biome(distance);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,hexMix(B.a.sky0,B.b.sky0,B.m));sky.addColorStop(1,hexMix(B.a.sky1,B.b.sky1,B.m));ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fffe';ctx.beginPath();ctx.arc(W*0.8,H*0.16,20,0,7);ctx.fill();ctx.globalAlpha=0.4;ctx.fillStyle=hexMix(B.a.g1,B.b.g1,B.m);ctx.beginPath();ctx.moveTo(0,H);for(let i=0;i<=W;i+=10)ctx.lineTo(i,H*0.4+noise(t*0.3+i*0.6+200)/255*H*0.14);ctx.lineTo(W,H);ctx.fill();ctx.globalAlpha=1;drawDecor();const grd=ctx.createLinearGradient(0,H*0.5,0,H);grd.addColorStop(0,hexMix(B.a.g0,B.b.g0,B.m));grd.addColorStop(1,hexMix(B.a.dirt,B.b.dirt,B.m));ctx.fillStyle=grd;ctx.beginPath();ctx.moveTo(0,H);for(let i=0;i<=W;i+=4)ctx.lineTo(i,ground(t+i));ctx.lineTo(W,H);ctx.fill();particles.forEach(p=>{ctx.globalAlpha=p.life/14;ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;drawBike();ctx.fillStyle='#0006';ctx.fillRect(12,H-120,8,44);ctx.fillStyle='#d4ff3a';const sh=44*(speed/1.2);ctx.fillRect(12,H-76-sh,8,sh)}function drawDecor(){for(const d of decor){const x=d.wx-t;if(x<-70||x>W+70)continue;const y=ground(d.wx);ctx.save();ctx.translate(x,y);ctx.scale(d.s*d.flip,d.s);if(d.kind==='pine'){ctx.fillStyle='#5a3310';ctx.fillRect(-4,-16,8,16);ctx.fillStyle='#1d5a28';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(0,-72+i*16);ctx.lineTo(20-i*3,-24+i*12);ctx.lineTo(-20+i*3,-24+i*12);ctx.fill()}}else if(d.kind==='grass'){ctx.strokeStyle='#2f7a22';ctx.lineWidth=2;for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*3,0);ctx.quadraticCurveTo(i*3+2,-10,i*4,-16);ctx.stroke()}}else if(d.kind==='flower'){ctx.strokeStyle='#2f7a22';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-16);ctx.stroke();ctx.fillStyle='#ff5d8f';for(let i=0;i<5;i++){const a=i*1.256;ctx.beginPath();ctx.arc(Math.cos(a)*5,-16+Math.sin(a)*5,3,0,7);ctx.fill()}ctx.fillStyle='#ffd24a';ctx.beginPath();ctx.arc(0,-16,3,0,7);ctx.fill()}else if(d.kind==='hay'){ctx.fillStyle='#c9a227';ctx.beginPath();ctx.ellipse(0,-10,16,10,0,0,7);ctx.fill()}else if(d.kind==='rock'){ctx.fillStyle='#7a7268';ctx.beginPath();ctx.moveTo(-14,0);ctx.lineTo(-8,-14);ctx.lineTo(4,-18);ctx.lineTo(14,-7);ctx.lineTo(10,0);ctx.fill()}else if(d.kind==='bush'){ctx.fillStyle='#6a8a3a';ctx.beginPath();ctx.arc(-8,-8,9,0,7);ctx.arc(4,-10,11,0,7);ctx.arc(10,-6,7,0,7);ctx.fill()}else{ctx.fillStyle='#6b3f16';ctx.fillRect(-7,-10,14,10)}ctx.restore()}}function drawBike(){ctx.save();ctx.translate(bike.x,bike.y);ctx.rotate(bike.rot);ctx.scale(1.4,1.4);if(hold.gas&&playing){ctx.fillStyle='rgba(255,170,40,.6)';ctx.beginPath();ctx.moveTo(-22,6);ctx.lineTo(-32-speed*8,9);ctx.lineTo(-22,12);ctx.fill()}wheel(-13,10);wheel(14,10);ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-4,2);ctx.lineTo(-13,10);ctx.stroke();ctx.beginPath();ctx.moveTo(6,-2);ctx.lineTo(14,10);ctx.stroke();ctx.fillStyle='#e21b2c';ctx.beginPath();ctx.moveTo(-16,4);ctx.lineTo(-8,-6);ctx.lineTo(10,-8);ctx.lineTo(18,2);ctx.lineTo(8,6);ctx.lineTo(-10,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-2,-10,12,5);ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(2,-16,5.2,0,7);ctx.fill();ctx.fillStyle='#2c4d8a';ctx.beginPath();ctx.moveTo(-2,-12);ctx.lineTo(8,-11);ctx.lineTo(6,2);ctx.lineTo(-6,3);ctx.fill();ctx.restore()}function wheel(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(t*0.06);ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.strokeStyle='#ccc';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,6.5,0,7);ctx.stroke();ctx.restore()}seed();resize();(function loop(){update();draw();requestAnimationFrame(loop)})()})();</script></body></html>
